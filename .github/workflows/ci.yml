name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

jobs:
  # Keep this job id and name stable - it is the status check name that
  # branch protection requires. Renaming it silently stops gating merges.
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      # config.json holds live secrets and is gitignored, but several modules
      # require() it at load time. The committed example has the same shape
      # with placeholder values, which is all the test suite needs.
      - run: cp config.example.json config.json

      # Runs pretest (swagger) then jest, which enforces the 80% coverage
      # threshold from jest.config.js.
      - run: npm test
